<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 뭐 먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{
  --board:#FFD23F; --ink:#1B2340; --stamp:#E4402B; --paper:#FFF9E8;
  --muted:#5B6384; --line:#1B234026; --seg-a:#FFD23F; --seg-b:#FFF3C4;
  --seg-c:#F7A072; --seg-d:#9CD3C9;
  --bg:var(--paper); --fg:var(--ink); --card:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A30; --fg:#F4EEDA; --card:#1E2644; --muted:#A7AECB; --line:#F4EEDA26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A30; --fg:#F4EEDA; --card:#1E2644; --muted:#A7AECB; --line:#F4EEDA26;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.55 "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  padding-inline:16px; padding-block:20px 40px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
h1{
  font-family:"Black Han Sans", "Apple SD Gothic Neo", sans-serif; font-weight:400;
  font-size:clamp(2.1rem, 9vw, 2.8rem); line-height:1; margin:0; text-wrap:balance;
}
h1 span{color:var(--stamp)}
.sub{margin:6px 0 0; color:var(--muted); font-size:.9rem}
.stamp{
  flex:none; border:2px solid var(--stamp); color:var(--stamp); border-radius:6px;
  padding:4px 8px; font-size:.72rem; font-weight:600; letter-spacing:.08em;
  transform:rotate(-6deg); text-transform:uppercase;
}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  font:inherit; font-size:.88rem; font-weight:600; cursor:pointer;
  border:1.5px solid var(--fg); background:transparent; color:var(--fg);
  border-radius:999px; padding:6px 14px;
}
.chip[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.chip:focus-visible,.spin:focus-visible,.add button:focus-visible,.item button:focus-visible,input:focus-visible{outline:3px solid var(--stamp); outline-offset:2px}
.wheel-box{position:relative; width:100%; max-width:380px; margin:0 auto; aspect-ratio:1}
canvas{width:100%; height:100%; display:block}
.pointer{
  position:absolute; left:50%; top:-6px; transform:translateX(-50%);
  width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
  border-top:28px solid var(--stamp); filter:drop-shadow(0 2px 0 #0003);
}
.spin{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:26%; aspect-ratio:1; border-radius:50%; border:4px solid var(--ink);
  background:var(--stamp); color:#fff; cursor:pointer;
  font-family:"Black Han Sans", sans-serif; font-size:clamp(1rem,5vw,1.35rem);
  box-shadow:0 4px 0 var(--ink);
}
.spin:active{transform:translate(-50%,-46%); box-shadow:0 1px 0 var(--ink)}
.spin:disabled{opacity:.85; cursor:default}
.result{
  background:var(--board); color:var(--ink); border-radius:14px; padding:16px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:76px;
}
.result small{display:block; font-size:.78rem; font-weight:600; letter-spacing:.06em; opacity:.7}
.result strong{font-family:"Black Han Sans", sans-serif; font-weight:400; font-size:1.7rem; line-height:1.15}
.result .tag{font-size:.8rem; font-weight:600; border:1.5px solid var(--ink); border-radius:999px; padding:2px 10px; white-space:nowrap}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
section h2{font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; font-weight:600}
.add{display:flex; gap:8px}
.add input{
  flex:1; min-width:0; font:inherit; padding:10px 12px; border-radius:10px;
  border:1.5px solid var(--line); background:var(--card); color:var(--fg);
}
.add button{font:inherit; font-weight:600; border:0; border-radius:10px; padding:0 16px; background:var(--fg); color:var(--bg); cursor:pointer}
.items{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; padding:0; list-style:none}
.item{display:flex; align-items:center; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 4px 4px 10px; font-size:.88rem}
.item button{border:0; background:none; color:var(--muted); font-size:1rem; cursor:pointer; width:26px; height:26px; border-radius:6px}
.hint{color:var(--muted); font-size:.82rem; margin:8px 0 0}
.history{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.history li{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums}
.history li span:last-child{color:var(--muted); font-size:.85rem}
.empty{color:var(--muted); font-size:.88rem}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>오늘 뭐 <span>먹지?</span></h1>
      <p class="sub">고민은 룰렛에게. 가운데 버튼을 누르세요.</p>
    </div>
    <div class="stamp">메뉴판</div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="음식 종류"></div>

  <div class="wheel-box">
    <canvas id="wheel" width="760" height="760" aria-label="메뉴 룰렛"></canvas>
    <div class="pointer" aria-hidden="true"></div>
    <button class="spin" id="spin">돌려!</button>
  </div>

  <div class="result" id="result" aria-live="polite">
    <div><small>오늘의 메뉴</small><strong id="pick">?</strong></div>
    <span class="tag" id="pickTag" hidden></span>
  </div>

  <section>
    <h2>내 메뉴 추가</h2>
    <form class="add" id="addForm">
      <input id="newItem" maxlength="12" placeholder="예: 마라탕" autocomplete="off" aria-label="추가할 메뉴">
      <button type="submit">추가</button>
    </form>
    <ul class="items" id="items"></ul>
    <p class="hint">× 를 누르면 룰렛에서 빠져요. 추가한 메뉴는 '내 메뉴'에 들어가요.</p>
  </section>

  <section>
    <h2>최근 결과</h2>
    <ul class="history" id="history"></ul>
  </section>
</div>

<script>
(function(){
  const DEFAULT = {
    "한식":["김치찌개","된장찌개","비빔밥","제육볶음","불고기","삼겹살","국밥","냉면"],
    "중식":["짜장면","짬뽕","탕수육","마파두부","볶음밥"],
    "일식":["초밥","라멘","돈카츠","우동","규동"],
    "양식":["파스타","피자","햄버거","스테이크","리조또"],
    "분식":["떡볶이","김밥","라볶이","순대","쫄면"]
  };
  const KEY = "whattoeat.v1";
  let state = { menus: JSON.parse(JSON.stringify(DEFAULT)), custom: [], cat: "전체", history: [] };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.menus) state = Object.assign(state, s); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");
  const cats = () => ["전체", ...Object.keys(state.menus), "내 메뉴"];
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function pool(){
    if (state.cat === "전체") {
      const all = [];
      for (const [c, list] of Object.entries(state.menus)) list.forEach(n => all.push({n, c}));
      state.custom.forEach(n => all.push({n, c:"내 메뉴"}));
      return all;
    }
    if (state.cat === "내 메뉴") return state.custom.map(n => ({n, c:"내 메뉴"}));
    return (state.menus[state.cat] || []).map(n => ({n, c:state.cat}));
  }

  let rotation = 0, spinning = false;

  function draw(){
    const items = pool(), W = canvas.width, r = W/2 - 10, cx = W/2, cy = W/2;
    ctx.clearRect(0,0,W,W);
    const ink = cssVar("--ink");
    if (!items.length){
      ctx.fillStyle = cssVar("--card"); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.lineWidth = 8; ctx.strokeStyle = ink; ctx.stroke();
      ctx.fillStyle = cssVar("--muted"); ctx.font = "600 30px 'IBM Plex Sans KR', sans-serif";
      ctx.textAlign = "center"; ctx.fillText("메뉴를 추가해 주세요", cx, cy - 120);
      return;
    }
    const seg = Math.PI*2/items.length;
    const fills = [cssVar("--seg-a"), cssVar("--seg-b"), cssVar("--seg-c"), cssVar("--seg-d")];
    const fs = Math.max(20, Math.min(40, 520/items.length + 12));
    items.forEach((it, i) => {
      const a0 = rotation + i*seg - Math.PI/2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a0+seg); ctx.closePath();
      ctx.fillStyle = fills[items.length % 4 === 1 && i === items.length-1 ? 1 : i % 4]; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.stroke();
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(a0 + seg/2);
      ctx.fillStyle = "#1B2340"; ctx.font = `600 ${fs}px 'IBM Plex Sans KR', sans-serif`;
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(it.n, r - 22, 0); ctx.restore();
    });
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.lineWidth = 10; ctx.strokeStyle = ink; ctx.stroke();
  }

  function renderChips(){
    $("chips").innerHTML = "";
    cats().forEach(c => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === state.cat);
      b.onclick = () => { if (spinning) return; state.cat = c; save(); renderAll(); };
      $("chips").appendChild(b);
    });
  }

  function renderItems(){
    const ul = $("items"); ul.innerHTML = "";
    pool().forEach(it => {
      const li = document.createElement("li"); li.className = "item";
      li.append(it.n);
      const x = document.createElement("button"); x.textContent = "×"; x.setAttribute("aria-label", it.n + " 빼기");
      x.onclick = () => {
        if (spinning) return;
        if (it.c === "내 메뉴") state.custom = state.custom.filter(n => n !== it.n);
        else state.menus[it.c] = state.menus[it.c].filter(n => n !== it.n);
        save(); renderAll();
      };
      li.appendChild(x); ul.appendChild(li);
    });
  }

  function renderHistory(){
    const ul = $("history"); ul.innerHTML = "";
    if (!state.history.length){ ul.innerHTML = '<li class="empty">아직 돌린 기록이 없어요.</li>'; return; }
    state.history.slice(0,5).forEach(h => {
      const li = document.createElement("li");
      const a = document.createElement("span"); a.textContent = h.n;
      const b = document.createElement("span"); b.textContent = h.c + " · " + h.t;
      li.append(a, b); ul.appendChild(li);
    });
  }

  function renderAll(){ renderChips(); renderItems(); renderHistory(); draw(); }

  $("spin").onclick = () => {
    const items = pool();
    if (spinning || !items.length) return;
    spinning = true; $("spin").disabled = true;
    const seg = Math.PI*2/items.length;
    const win = Math.floor(Math.random()*items.length);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Land the winning segment's middle (with a little jitter) under the top pointer.
    const jitter = (Math.random()-.5) * seg * .7;
    const target = -(win*seg + seg/2 + jitter);
    const start = rotation, base = start - (start % (Math.PI*2));
    const end = base + target + Math.PI*2*(reduce ? 1 : 6);
    const dur = reduce ? 400 : 4200, t0 = performance.now();
    const ease = t => 1 - Math.pow(1-t, 4);
    (function frame(now){
      const t = Math.min(1, (now - t0)/dur);
      rotation = start + (end - start) * ease(t); draw();
      if (t < 1) return requestAnimationFrame(frame);
      rotation = end % (Math.PI*2);
      spinning = false; $("spin").disabled = false;
      const it = items[win];
      $("pick").textContent = it.n;
      $("pickTag").textContent = it.c; $("pickTag").hidden = false;
      const box = $("result"); box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
      const d = new Date();
      state.history.unshift({n:it.n, c:it.c, t:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`});
      state.history = state.history.slice(0,5); save(); renderHistory();
    })(t0);
  };

  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("newItem").value.trim();
    if (!v || spinning) return;
    if (!state.custom.includes(v)) state.custom.push(v);
    $("newItem").value = "";
    if (state.cat !== "전체") state.cat = "내 메뉴";
    save(); renderAll();
  });

  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
  new MutationObserver(draw).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
  document.fonts?.ready.then(draw);
  renderAll();
})();
</script>
</body>
</html>
